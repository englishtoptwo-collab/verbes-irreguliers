<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maîtrise Verbes Irréguliers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1d4ed8;--blue2:#2563eb;--bl:#eff6ff;--bl2:#dbeafe;--green:#16a34a;--gl:#f0fdf4;--gl2:#bbf7d0;--red:#dc2626;--rl:#fef2f2;--rl2:#fecaca;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--hh:110px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;max-width:820px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;letter-spacing:.5px}
.bt{font-weight:800;font-size:15px;line-height:1.15;color:var(--blue)}
.hbtn{border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.hbtn.on{background:var(--blue);color:#fff}
nav{display:flex;max-width:820px;margin:0 auto;padding:0 8px}
nav button{flex:1;border:0;background:none;padding:10px 4px;font-weight:700;font-size:14px;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--blue);border-bottom-color:var(--blue)}
main{max-width:820px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:24px;line-height:1.2;margin:4px 0 6px;color:var(--blue)}
h2{font-size:19px;margin:0 0 8px;color:var(--blue)}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 10px}
.mut{color:var(--mut)}
.hero{padding:6px 0 12px}
.search{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:16px;outline:none}
.search:focus,input:focus,textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px var(--bl2)}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.letters a{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--bl);color:var(--blue);font-weight:800;text-decoration:none;font-size:14px}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:clip}
.th,.tr{display:grid;grid-template-columns:1fr 1fr 1.05fr 1.5fr;gap:6px;padding:9px 12px;align-items:center;font-size:14px}
.th{background:var(--blue);color:#fff;font-weight:800;position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px) - 2px);z-index:5}
.tr{border-top:1px solid var(--line)}
.tr b{color:var(--blue)}
.tr span:nth-child(3){color:var(--green);font-weight:700}
.tr .fr{color:var(--mut);display:flex;justify-content:space-between;gap:4px;align-items:center}
.tr .fr i{font-style:normal;font-size:11px;font-weight:800;background:var(--bl);color:var(--blue);border-radius:6px;padding:1px 6px;white-space:nowrap}
.lt{background:var(--bl);color:var(--blue);font-weight:800;padding:4px 12px;scroll-margin-top:calc(var(--hh) + 56px)}
.empty{padding:20px;text-align:center;color:var(--mut)}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:#fff}
.card.go{border-color:var(--blue2);background:var(--bl)}
.card.wait{border-color:var(--line);background:#f8fafc}
.card.good{border-color:var(--gl2);background:var(--gl)}
.card.bad{border-color:var(--rl2);background:var(--rl)}
.card.ex{border-left:5px solid var(--blue2)}
.ex q{display:block;font-style:normal;background:var(--bl);border-radius:8px;padding:6px 10px;margin:6px 0;font-weight:600}
.ex q b{color:var(--green)}
.wrong{background:var(--rl);color:var(--red);border-radius:8px;padding:6px 10px;margin:4px 0;font-weight:600}
.right{background:var(--gl);color:var(--green);border-radius:8px;padding:6px 10px;margin:4px 0 10px;font-weight:600}
.tbl3{width:100%;border-collapse:collapse;font-size:14px}
.tbl3 th{background:var(--blue);color:#fff;text-align:left;padding:8px 10px}
.tbl3 td{padding:8px 10px;border-top:1px solid var(--line)}
.btn{display:inline-block;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;font-size:16px;border-radius:12px;padding:12px 20px;margin:4px 6px 4px 0}
.btn.primary{background:var(--blue);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--mut)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%;margin-right:0}
.chip{display:inline-block;background:var(--bl);color:var(--blue);font-weight:800;border-radius:999px;padding:3px 11px;font-size:13px;margin:2px 4px 2px 0}
.bar{height:10px;background:var(--bl);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.bar.b i{background:var(--blue2)}
.cd{font-size:34px;font-weight:800;color:var(--blue);letter-spacing:1px;margin:6px 0;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:560px){.grid{grid-template-columns:repeat(7,1fr)}}
.tile{border:2px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;background:#fff;font-weight:800;color:var(--mut);min-height:62px;font-size:13px}
.tile big{display:block;font-size:20px;line-height:1.1}
.tile.open{border-color:var(--blue2);color:var(--blue);background:var(--bl)}
.tile.done{border-color:var(--gl2);background:var(--gl);color:var(--green)}
.tile.done.low{border-color:var(--rl2);background:var(--rl);color:var(--red)}
.tile.wait{border-style:dashed}
.tile:disabled{cursor:default}
.back{border:0;background:none;color:var(--blue);font-weight:800;font-size:15px;padding:6px 0;margin-bottom:6px}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800;color:var(--blue)}
.qlabel{color:var(--mut);font-weight:700;font-size:14px;margin:14px 0 6px}
.prompt{font-size:21px;font-weight:700;line-height:1.35;margin:4px 0 16px}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--blue2);color:transparent}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font-size:17px;font-weight:700;color:var(--ink)}
.opt b{width:30px;height:30px;border-radius:50%;background:var(--bl);color:var(--blue);display:grid;place-items:center;flex:none;font-size:14px}
.opt.sel{border-color:var(--blue2);background:var(--bl)}
.opt.sel b{background:var(--blue2);color:#fff}
.two{display:grid;gap:12px}
.two label,.sent label{display:block;font-weight:700;font-size:14px;color:var(--mut)}
input[type=text],.two input,textarea{width:100%;margin-top:4px;padding:12px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:17px;outline:none;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
.hint{color:var(--red);font-weight:700;min-height:22px;margin:10px 0 0}
.score{text-align:center;padding:22px 12px}
.score .n{font-size:58px;font-weight:800;line-height:1}
.score .n small{font-size:24px;opacity:.7}
.score.red .n{color:var(--red)}.score.green .n{color:var(--green)}
.cq{border:1px solid var(--line);border-left:6px solid var(--green);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.cq.ko{border-left-color:var(--red);background:#fffafa}
.cqh{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-weight:800}
.cqh .no{color:var(--mut);font-size:13px}
.cq.ok .mark{color:var(--green)}.cq.ko .mark{color:var(--red)}
.cen{font-size:17px;font-weight:600}
.cen .g,.g{color:var(--green)}
.cfr{color:var(--mut);margin-top:2px}
.yours{margin-top:8px;color:var(--red);font-weight:700}
.exp{margin-top:6px;background:var(--bl);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:15px}
.sent{margin-bottom:14px}
.sent .vv{font-weight:800;color:var(--blue);margin-bottom:2px}
.sent .err{color:var(--red);font-weight:700;font-size:14px;margin-top:4px}
.recap{border:2px solid var(--blue2);border-radius:16px;padding:18px;background:#fff}
.recap .rh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.recap .rs{margin:10px 0;padding:10px 12px;background:var(--bl);border-radius:10px}
.recap .rs b{color:var(--blue)}
.recap mark{background:var(--gl2);color:#065f2c;border-radius:4px;padding:0 3px}
.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px}
.badge.green{background:var(--gl);color:var(--green);border:1px solid var(--gl2)}
.badge.red{background:var(--rl);color:var(--red);border:1px solid var(--rl2)}
.hist{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;margin-bottom:10px}
.hist .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:17px}
.cf{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--blue) 0%,var(--green) 100%);color:#fff;border-radius:18px;padding:30px 18px;text-align:center;margin-bottom:16px}
.cf h2{color:#fff;font-size:34px;margin:0 0 4px}
.cf p{position:relative;font-size:17px}
.cf i{position:absolute;top:-16px;width:9px;height:15px;opacity:.9;animation:fall 3.2s linear infinite}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:.2}}
@media(prefers-reduced-motion:reduce){.cf i{animation:none;display:none}}
.pbars div{margin:8px 0}
.pbars .row{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.bar.r i{background:var(--red)}
.cenb{text-align:center}
.note{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<header id="hd">
  <div class="hrow">
    <div class="brand"><span class="logo">MV</span><span class="bt">Maîtrise<br>Verbes Irréguliers</span></div>
    <button class="hbtn" id="hist" onclick="openHist()">🕘 Historique</button>
  </div>
  <nav>
    <button data-v="list" onclick="goV('list')">📚 Liste</button>
    <button data-v="lesson" onclick="goV('lesson')">🎓 Leçon</button>
    <button data-v="challenge" onclick="goV('challenge')">🏆 Mon Challenge</button>
  </nav>
</header>
<main id="app"></main>

/* ============ LOGIQUE VERBES ============ */
const ALTP={abide:["abided"],dwell:["dwelled"],kneel:["kneeled"],knit:["knitted"],lean:["leaned"],leap:["leaped"],spoil:["spoiled"],speed:["speeded"],wet:["wetted"],fit:["fitted"],burn:["burned"],dream:["dreamed"],learn:["learned"],smell:["smelled"],spell:["spelled"],spill:["spilled"],light:["lighted"],hang:["hanged"],bet:["betted"],lie:["lied"]};
const ALTPP=Object.assign({show:["showed"]},ALTP);
const ing=b=>b==="be"?"being":/[^e]e$/.test(b)?b.slice(0,-1)+"ing":b+"ing";
const s3=b=>/(s|x|ch|sh|o)$/.test(b)?b+"es":/[^aeiou]y$/.test(b)?b.slice(0,-1)+"ies":b+"s";
const regOf=v=>v.b==="be"?"was":v.b.endsWith("e")?v.b+"d":v.b+"ed";
const forms=v=>v.b==="be"?{pres:"are",past:"were",pp:"been"}:{pres:v.b,past:v.p,pp:v.pp};
const deja=s=>s.replace(/^(se sont|sont|ont) /,"$1 déjà ");
const plusque=s=>s.replace(/^se sont /,"s'étaient ").replace(/^sont /,"étaient ").replace(/^ont /,"avaient ");
const jamais=s=>s.replace(/^se sont /,"ne se sont jamais ").replace(/^sont /,"ne sont jamais ").replace(/^ont /,"n'ont jamais ");
function mk4(correct,pool,valid){const w=shuffle([...new Set(pool)].filter(x=>!valid.includes(x)&&x!==correct)).slice(0,3);const opts=shuffle([correct,...w]);return{opts,ci:opts.indexOf(correct)}}
function okForm(inp,v,which){const x=String(inp||"").trim().toLowerCase();if(!x)return false;const base=(which==="p"?v.p:v.pp).split("/");const alt=(which==="p"?ALTP:ALTPP)[v.b]||[];return [...base,...alt].includes(x)}
const verbOf=b=>V.find(v=>v.b===b);

/* ============ GÉNÉRATION DES QUESTIONS ============ */
function mkQ(v,t){
  const f=forms(v),R=regOf(v),I=ing(v.b),S3=s3(v.b),F3=`${v.b} → ${v.p} → ${v.pp}`;
  const pool=v.b==="be"?["are","was","were","been","being","is"]:[f.pres,f.past,f.pp,R,I,S3];
  const aP=ALTP[v.b]||[],aPP=ALTPP[v.b]||[];
  const q={verb:v.b,type:t};let m;
  if(t==="pres"){
    q.label="Complète la phrase";q.prompt=`Every day, they ___ ${v.o}.`;m=mk4(f.pres,pool,[f.pres]);
    q.fr=`Chaque jour, ils ${v.fp}.`;
    q.exp=`« Every day » (chaque jour) exprime une habitude → présent simple. Avec « they », le verbe garde sa forme de base : ${f.pres}. (${F3})`;
  }else if(t==="past"){
    q.label="Complète la phrase";q.prompt=`Yesterday, they ___ ${v.o}.`;m=mk4(f.past,pool,[f.past,...aP]);
    q.fr=`Hier, ils ${v.fpa}.`;
    q.exp=`« Yesterday » (hier) indique une action terminée dans le passé → prétérit (2ᵉ forme) : ${f.past}. ${f.past===v.b?"Ce verbe ne change pas au prétérit. ":""}${(R===f.past||aP.includes(R))?"":`On ne dit pas « ${R} » : le verbe est irrégulier. `}(${F3})`;
  }else if(t==="pp"){
    q.label="Complète la phrase";q.prompt=`They have already ___ ${v.o}.`;m=mk4(f.pp,pool,[f.pp,...aPP]);
    q.fr=`Ils ${deja(v.fpa)}.`;
    q.exp=`Après « have already » on emploie le participe passé (3ᵉ forme) : ${f.pp}. Le prétérit (${f.past}) ne s'utilise pas après « have ». (${F3})`;
  }else{
    const c=`Yesterday, they ${f.past} ${v.o}.`;
    q.label="Choisis la bonne traduction";q.prompt=`Hier, ils ${v.fpa}.`;
    m=mk4(c,[`Yesterday, they have ${f.pp} ${v.o}.`,`Yesterday, they ${f.pres} ${v.o}.`,`Yesterday, they ${R} ${v.o}.`,`Yesterday, they ${I} ${v.o}.`,`Yesterday, they will ${v.b} ${v.o}.`],[c,...aP.map(x=>`Yesterday, they ${x} ${v.o}.`)]);
    q.fr=q.prompt;
    q.exp=`Avec « yesterday », on utilise le prétérit simple, jamais « have + participe passé » ni la forme de base. Bonne phrase : they ${f.past}. (${F3})`;
  }
  q.opts=m.opts;q.ci=m.ci;return q;
}
function mkF(v,k){
  const f=forms(v),R=regOf(v),F3=`${v.b} → ${v.p} → ${v.pp}`;
  const aPP=ALTPP[v.b]||[];const q={verb:v.b,type:"f"+k};let m;
  if(k===1){
    const c=`had already ${f.pp}`;
    q.label="Complète la phrase (test final)";q.prompt=`By the time the teacher arrived, they ___ ${v.o}.`;
    m=mk4(c,[`have already ${f.pp}`,`has already ${f.pp}`,`had already ${f.past}`,`already ${f.past}`,`had already ${R}`,`will already ${f.pp}`],[c,...aPP.map(x=>`had already ${x}`)]);
    q.fr=`Quand le professeur est arrivé, ils ${plusque(deja(v.fpa))}.`;
    q.exp=`« By the time + prétérit » : l'action s'est passée avant une autre action passée → past perfect : had + participe passé (3ᵉ forme) → had already ${f.pp}. (${F3})`;
  }else if(k===2){
    const c=`They have never ${f.pp} ${v.o}.`;
    q.label="Choisis la phrase correcte (test final)";q.prompt="Quelle phrase est correcte ?";
    m=mk4(c,[`They have never ${f.past} ${v.o}.`,`They did never ${f.pp} ${v.o}.`,`They are never ${f.pp} ${v.o}.`,`They have never ${R} ${v.o}.`,`They never has ${f.pp} ${v.o}.`],[c,...aPP.map(x=>`They have never ${x} ${v.o}.`)]);
    q.fr=`Ils ${jamais(v.fpa)}.`;
    q.exp=`« never » + expérience jusqu'à maintenant → present perfect : have + participe passé (3ᵉ forme) → have never ${f.pp}. (${F3})`;
  }else{
    q.typed=true;q.label="Écris les formes (test final)";q.prompt=`« ${v.fr} » — base : ${v.b}`;
    q.fr=v.fr;q.full=F3;q.exp=`Les 3 formes à connaître : ${F3}.`;return q;
  }
  q.opts=m.opts;q.ci=m.ci;return q;
}
function dayQs(n){const qs=[];dayVerbs(n).forEach(v=>["pres","past","pp","trans"].forEach(t=>qs.push(mkQ(v,t))));return shuffle(qs)}
function missCounts(){const m={};for(let n=1;n<=TD;n++)(S.done[n]?.qs||[]).forEach(q=>{if(!q.ok)m[q.verb]=(m[q.verb]||0)+1});return m}
function finalQs(){const m=missCounts();const sel=V.map(v=>[v,(m[v.b]||0)+Math.random()*.9]).sort((a,b)=>b[1]-a[1]).slice(0,30).map(x=>x[0]);return shuffle(sel).map((v,i)=>mkF(v,i%3+1))}

    <tr><td><b>2. Prétérit</b></td><td>past simple</td><td>wrote</td></tr>
    <tr><td><b>3. Participe passé</b></td><td>past participle</td><td>written</td></tr></table>
    <p class="note" style="margin-top:8px">Un verbe régulier ajoute -ed aux formes 2 et 3 (walk – walked – walked). Un verbe irrégulier change autrement : il faut l'apprendre.</p>

    <q>They <b>write</b> every day.</q><q>He <b>writes</b> every day. <span class="mut">(3ᵉ personne : +s)</span></q><q>She can <b>write</b> / Do you <b>write</b>?</q></div>

    <p><b>had + participe</b> : avant une autre action passée.</p><q>She had already <b>left</b> when I arrived.</q>
    <p><b>be + participe</b> : la voix passive.</p><q>The letter was <b>written</b> by Tom.</q></div>
  <div class="card"><h2>Astuce : 4 familles de verbes</h2>
    <table class="tbl3"><tr><th>Modèle</th><th>Exemples</th></tr>

/* ============ PAGE 3 : CHALLENGE ============ */
function unlockTs(n){
  if(n===1)return 0;
  if(n===FINAL&&S.done[FINAL])return 0;
  if(S.unlock[n]!=null)return S.unlock[n];
  const p=S.done[n-1];return p?nextSix(p.at):null;
}
function st(n){
  if(S.done[n]&&(n<FINAL||S.done[n].passed))return"done";
  if(n===FINAL&&S.done[FINAL])return"open";
  const u=unlockTs(n);if(u===null)return"locked";
  return u<=Date.now()?"open":"wait";
}
function pageChallenge(){
  const m=ch.mode;
  ({home:chHome,intro:chIntro,quiz:chQuiz,result:chResult,sent:chSent,recap:chRecap,bilan:chBilan})[m]();

    }
  }else{
    action=`<div class="card good"><h2>🎉 Challenge terminé</h2><p>Tu as réussi le test final. Bravo !</p><button class="btn green" onclick="openResult(${FINAL})">Revoir mon test final</button></div>`;

    return`<button class="tile" disabled><big>${n===FINAL?"🏁":n}</big>🔒</button>`;
  }).join("");
  $("#app").innerHTML=`<section class="hero"><h1>Mon Challenge</h1><p class="mut">24 questions par jour, notées sur 20, sur 6 verbes${LAST<6?` (le dernier jour : ${LAST} verbe${LAST>1?"s":""})`:""}. Le jour suivant s'ouvre à 6h00.</p></section>
  <div class="card"><div class="qtop"><span>${doneN} / ${TD} jours terminés</span><span>${avg===null?"":"Moyenne "+fmt(avg)+"/20"}</span></div><div class="bar"><i style="width:${doneN/TD*100}%"></i></div></div>

function isDone(i){const a=ch.ans[i];return ch.qs[i].typed?(a[0].trim()&&a[1].trim()):a!==null}
function upd(){

  const miss=[];for(let i=0;i<ch.qs.length;i++)if(!isDone(i))miss.push(i);
  if(miss.length){
    $("#hint").textContent=miss.length===1?"Il reste la question "+(miss[0]+1)+" à répondre.":"Il reste "+miss.length+" questions à répondre (première : "+(miss[0]+1)+").";

function finish(){
  const {n,qs,ans}=ch;
  const rec=qs.map((q,i)=>{
    const a=ans[i];let ok;
    if(q.typed){const v=verbOf(q.verb);ok=okForm(a[0],v,"p")&&okForm(a[1],v,"pp")}else ok=a===q.ci;
    return Object.assign({},q,{ans:a,ok});
  });
  const correct=rec.filter(r=>r.ok).length,score=correct/qs.length*20;
  const d={n,at:Date.now(),total:qs.length,correct,score,qs:rec};
  if(n===FINAL)d.passed=score>=PASS;
  if(!(n===FINAL&&S.done[FINAL]&&S.done[FINAL].passed)){S.done[n]=d;save()}
  show({mode:"result",n});
}

/* ----- correction ----- */
function fullHtml(q){
  if(q.typed)return `<b class="g">${esc(q.full)}</b>`;
  if(q.type==="trans"||q.type==="f2")return `<b class="g">${esc(q.opts[q.ci])}</b>`;
  return esc(q.prompt).replace("___",`<b class="g">${esc(q.opts[q.ci])}</b>`);
}
function yourAns(q){
  if(q.typed)return esc(q.ans.map(x=>x||"—").join(" / "));
  return q.ans===null||q.ans===undefined?"—":esc(q.opts[q.ans]);
}
function corrHtml(d){
  return d.qs.map((q,i)=>`<div class="cq ${q.ok?"ok":"ko"}"><div class="cqh"><span class="no">Question ${i+1}</span><span class="mark">${q.ok?"✓ Correct":"✗ Incorrect"}</span></div>
  <div class="cen">${fullHtml(q)}</div><div class="cfr">🇫🇷 ${esc(q.fr)}</div>
  ${q.ok?"":`<div class="yours">Ta réponse : ${yourAns(q)}</div><div class="exp">💡 ${esc(q.exp)}</div>`}</div>`).join("");
}
function confetti(){const c=["#ffffff","#bbf7d0","#dbeafe","#86efac","#93c5fd"];return Array.from({length:40},(_,i)=>`<i style="left:${Math.random()*100}%;animation-delay:${(Math.random()*3).toFixed(2)}s;background:${c[i%c.length]}"></i>`).join("")}
function chResult(){
  const n=ch.n,d=S.done[n];

  }
  let btns="";
  if(n<FINAL)btns=`<button class="btn primary" onclick="${d.sent?`show({mode:'recap',n:${n}})`:`startSent(${n})`}">${d.sent?"Voir mes phrases":"Mes phrases du jour"}</button>`;

/* ----- 6 phrases du jour ----- */
function startSent(n){const d=S.done[n];show({mode:"sent",n,sent:(d.sent||dayVerbs(n).map(()=>"")).slice(),err:[]})}
function hasForm(sent,v){
  const set=new Set(v.b==="be"?["be","am","is","are","was","were","been","being"]:[v.b,...v.p.split("/"),...v.pp.split("/"),...(ALTP[v.b]||[]),...(ALTPP[v.b]||[]),s3(v.b),ing(v.b),v.b+v.b.slice(-1)+"ing"]);
  return (sent.toLowerCase().match(/[a-zàâçéèêëîïôûùüÿ']+/g)||[]).some(w=>set.has(w));
}
function chSent(){
  const n=ch.n,vs=dayVerbs(n);
  $("#app").innerHTML=`<button class="back" onclick="openResult(${n})">← Ma correction</button><h1>Mes ${vs.length} phrases du jour</h1>
  <p class="mut">Écris une phrase en anglais avec chacun des ${vs.length} verbes du jour. Utilise la forme de ton choix (base, prétérit ou participe passé).</p>
  <div class="sent">${vs.map((v,k)=>`<div style="margin-bottom:14px"><label><div class="vv">${k+1}. ${v.b} – ${v.p} – ${v.pp} <span class="mut">(${v.fr})</span></div>
  <textarea oninput="ch.sent[${k}]=this.value" placeholder="Écris ta phrase en anglais" autocapitalize="sentences" spellcheck="false">${esc(ch.sent[k])}</textarea></label>${ch.err[k]?`<div class="err">${esc(ch.err[k])}</div>`:""}</div>`).join("")}</div>
  <button class="btn green full" onclick="validSent()">Valider mes ${vs.length} phrases</button>`;
}
function validSent(){
  const n=ch.n,vs=dayVerbs(n);ch.err=vs.map((v,k)=>{
    const s=(ch.sent[k]||"").trim();
    if(!s)return"Écris une phrase pour ce verbe.";
    if(s.split(/\s+/).length<3)return"Fais une phrase d'au moins 3 mots.";
    if(!hasForm(s,v))return`Utilise une forme de « ${v.b} » (${v.b}, ${v.p}, ${v.pp}) dans ta phrase.`;
    return"";
  });
  if(ch.err.some(Boolean)){render();const e=document.querySelector(".err");if(e)e.scrollIntoView({block:"center"});return}
  S.done[n].sent=ch.sent.map(s=>s.trim());S.done[n].sentAt=Date.now();save();
  show({mode:"recap",n});
}
function hl(s,v){
  const set=v.b==="be"?["be","am","is","are","was","were","been","being"]:[v.b,...v.p.split("/"),...v.pp.split("/"),...(ALTP[v.b]||[]),...(ALTPP[v.b]||[]),s3(v.b),ing(v.b),v.b+v.b.slice(-1)+"ing"];
  return esc(s).replace(/[A-Za-zÀ-ÿ']+/g,w=>set.includes(w.toLowerCase())?`<mark>${w}</mark>`:w);
}
function chRecap(){

/* ----- appréciation générale ----- */
function stats(){
  const recs=[];for(let n=1;n<=TD;n++)if(S.done[n])recs.push(S.done[n]);
  const avg=recs.reduce((a,r)=>a+r.score,0)/(recs.length||1);
  const bt={pres:[0,0],past:[0,0],pp:[0,0],trans:[0,0]},miss={};
  recs.forEach(r=>r.qs.forEach(q=>{if(bt[q.type]){bt[q.type][1]++;if(!q.ok)bt[q.type][0]++}if(!q.ok)miss[q.verb]=(miss[q.verb]||0)+1}));
  return{recs,avg,bt,miss};
}
function appreciation(){
  const s=stats(),N={pres:"le présent (forme de base)",past:"le prétérit",pp:"le participe passé",trans:"la compréhension des phrases"};
  const r=Object.entries(s.bt).map(([k,[e,t]])=>[k,t?e/t:0,e]).sort((a,b)=>b[1]-a[1]);
  const total=r.reduce((a,x)=>a+x[2],0);
  const top=Object.entries(s.miss).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);
  const lvl=s.avg>=18?"Excellent niveau":s.avg>=PASS?"Très bon niveau":s.avg>=12?"Bon niveau, à consolider":"Niveau encore fragile, à retravailler";
  const k=Math.min(5,s.recs.length),f5=s.recs.slice(0,k).reduce((a,x)=>a+x.score,0)/Math.max(1,k),l5=s.recs.slice(-k).reduce((a,x)=>a+x.score,0)/Math.max(1,k);
  const P=[`${lvl} : ta moyenne est de ${fmt(s.avg)}/20 sur ${s.recs.length} jours, avec ${total} erreur${total>1?"s":""} au total.`];
  if(total>0)P.push(`Ton point le plus fragile est ${N[r[0][0]]} (${r[0][2]} erreur${r[0][2]>1?"s":""}). Ton point le plus solide est ${N[r[r.length-1][0]]}.`);
  else P.push("Aucune erreur sur l'ensemble du challenge : parcours parfait.");
  if(top.length)P.push(`Verbes à revoir en priorité : ${top.join(", ")}. Ils reviendront en force dans le test final.`);
  P.push(l5>f5+1?"Tu as nettement progressé au fil des jours : la régularité paie.":l5<f5-1?"Tes notes ont un peu baissé vers la fin : relis la liste complète avant le test final.":"Tes résultats sont réguliers d'un jour à l'autre.");
  P.push("Prochaine étape : le test final corsé. Il faut au moins "+PASS+"/20 pour le réussir.");
  return{P,s,r,N,top};
}
function chBilan(){
  const a=appreciation(),s=a.s,u=unlockTs(FINAL),fs=st(FINAL);
  let go="";
  if(fs==="done")go=`<button class="btn green" onclick="openResult(${FINAL})">Revoir mon test final</button>`;
  else if(u!==null&&u<=Date.now())go=`<button class="btn primary" onclick="startIntro(${FINAL})">Passer au test final</button>`;
  else go=`<p class="mut">Test final disponible ${u?dateFr(u)+" à "+timeFr(u):""}</p><div class="cd" data-cd="${u}">${fmtCd(u-Date.now())}</div><button class="btn ghost" onclick="demoUnlock(${FINAL})">⏩ Passer l'attente (démo)</button>`;
  $("#app").innerHTML=`<button class="back" onclick="toHome()">← Mon Challenge</button><h1>Mon appréciation générale</h1>
  <div class="card score ${col(s.avg)}"><div class="mut" style="font-weight:800">Moyenne sur ${s.recs.length} jours</div><div class="n">${fmt(s.avg)}<small>/20</small></div></div>
  <div class="card">${a.P.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
  <div class="card"><h3>Erreurs par type de question</h3><div class="pbars">${a.r.map(([k,rate,e])=>{const t=s.bt[k][1];return`<div><div class="row"><span>${esc(a.N[k])}</span><span>${e} / ${t}</span></div><div class="bar ${rate>0.25?"r":""}"><i style="width:${Math.max(3,100-rate*100)}%"></i></div></div>`}).join("")}</div><p class="note">La barre indique ton taux de réussite.</p></div>
  <div>${go}</div>`;
}

    ${vs.length?`<div class="tbl" style="margin-bottom:14px"><div class="th"><span>Base</span><span>Prétérit</span><span>Part. passé</span><span>Français</span></div>${vs.map(v=>`<div class="tr"><b>${v.b}</b><span>${v.p}</span><span>${v.pp}</span><span class="fr"><span>${v.fr}</span></span></div>`).join("")}</div>`:""}
    ${d.sent?`<div class="recap" style="margin-bottom:14px"><h3>Mes phrases</h3>${vs.map((v,k)=>`<div class="rs"><b>${v.b}</b><br>${hl(d.sent[k],v)}</div>`).join("")}</div>`:(n<FINAL?`<button class="btn primary" onclick="view='challenge';startSent(${n})">Écrire mes phrases</button>`:"")}
    <h2>Correction</h2>${corrHtml(d)}`;
    return;
  }
  const ns=Object.keys(S.done).map(Number).sort((a,b)=>b-a);
  $("#app").innerHTML=`<section class="hero"><h1>Historique</h1><p class="mut">Tous les jours déjà effectués, avec leur contenu. Touche un jour pour le revoir.</p></section>
  ${ns.length?ns.map(n=>{const d=S.done[n],c=col(d.score);return`<button class="hist" onclick="histOpen=${n};render();window.scrollTo(0,0)"><div class="t"><span>${dayTitle(n)}</span><span class="badge ${c}">${fmt(d.score)}/20</span></div><div class="mut" style="font-size:14px;margin:2px 0 6px">${dateFr(d.at)} · ${timeFr(d.at)}${d.sent?" · phrases validées ✓":""}</div>${n===FINAL?'<span class="chip">Test final</span>':dayVerbs(n).map(v=>`<span class="chip">${v.b}</span>`).join("")}</button>`}).join(""):`<div class="card cenb"><p class="mut">Aucun jour effectué pour l'instant. Commence le Jour 1 dans « Mon Challenge ».</p><button class="btn primary" onclick="goV('challenge')">Aller au challenge</button></div>`}`;
}

window.addEventListener("resize",setHH);
if(window.ResizeObserver)new ResizeObserver(setHH).observe($("#hd"));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(setHH);
render();
</script>
</body>
</html>
